services:
  db:
    image: postgres:16-alpine
    container_name: almox-v1-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-almox_v1}
      POSTGRES_USER: ${POSTGRES_USER:-almox_v1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-almox_v1}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-almox_v1}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: almox-v1-backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-secret-key-change-me-before-deploying-to-production}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_URL: postgres://${POSTGRES_USER:-almox_v1}:${POSTGRES_PASSWORD:-almox_v1}@db:5432/${POSTGRES_DB:-almox_v1}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: almox-v1-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
  frontend-node-modules:
